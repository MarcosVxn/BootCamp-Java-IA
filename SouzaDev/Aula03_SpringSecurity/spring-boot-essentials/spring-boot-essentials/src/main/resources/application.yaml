spring:

  application:
    name: spring-boot-essentials

  datasource:
    url: jdbc:postgresql://localhost:5432/estudos_security?createDatabaseIfNotExist=true
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  expiration: ${JWT_EXPIRATION:930800}
  key: ${JWT_KEY:}